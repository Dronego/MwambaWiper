[env:mwambawiper-feather-s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
  madhephaestus/ESP32Servo
  adafruit/RTClib

; Target: Adafruit ESP32-S3 Feather, 4 MB flash + 2 MB PSRAM (product 5477).
; Servo PWM: A0. RTC: DS3231 FeatherWing on default SDA/SCL.
; Keep the servo power rail separate from the Feather's 5 V logic input.
