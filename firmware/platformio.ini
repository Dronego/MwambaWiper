[env:mwambawiper-esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
  madhephaestus/ESP32Servo
  adafruit/RTClib

; Board and GPIO mapping are provisional.
; Set board, SERVO_PIN, I2C_SDA_PIN and I2C_SCL_PIN for the actual DG-Core.
